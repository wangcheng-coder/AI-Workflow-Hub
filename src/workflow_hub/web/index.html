<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Workflow Hub</title>
  <link rel="stylesheet" href="/assets/console.css">
  <script>document.documentElement.lang = new URLSearchParams(location.search).get("lang") === "en" ? "en" : "zh-CN";</script>
</head>
<body>
  <div class="shell" data-shell="studio">
    <header class="top">
      <div class="brand"><span class="mark">WH</span><div><strong>AI Workflow Hub</strong><small><span class="zh">校验、空跑和本地运行</span><span class="en">Validate, dry-run, local run</span></small></div></div>
      <nav class="lang"><button type="button" data-lang="zh">中文</button><button type="button" data-lang="en">English</button></nav>
    </header>
    <main class="layout">
      <section class="panel">
<p class="note"><span class="zh">空跑不访问网络，也不执行 Shell。</span><span class="en">Dry-run uses no network and does not execute a shell.</span></p>
<label>YAML</label>
<textarea id="yaml">name: linear
version: 1
nodes:
  - id: start
    type: start
  - id: mark
    type: script
    config: {action: set, key: message, value: hello}
  - id: end
    type: end
edges:
  - {from: start, to: mark}
  - {from: mark, to: end}
</textarea>
<label><span class="zh">运行编号</span><span class="en">Run id</span></label>
<input id="run" placeholder="id">
<div class="actions">
  <button id="validate" type="button"><span class="zh">校验</span><span class="en">Validate</span></button>
  <button id="dry" type="button"><span class="zh">空跑</span><span class="en">Dry-run</span></button>
  <button class="primary" id="start" type="button"><span class="zh">运行</span><span class="en">Run</span></button>
  <button id="runs" type="button"><span class="zh">运行列表</span><span class="en">Runs</span></button>
  <button id="resume" type="button"><span class="zh">继续</span><span class="en">Resume</span></button>
</div>
</section>
      <section class="panel"><pre id="out" class="out"></pre></section>
    </main>
  </div>
  <script src="/assets/console.js"></script>
  <script src="/assets/page.js"></script>
</body>
</html>
